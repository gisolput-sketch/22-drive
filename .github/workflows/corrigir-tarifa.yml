name: Corrigir tarifa exibida
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir texto da tarifa
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Após 10 km, acrescenta R$ 1,50 por km excedente.'
          new='Após 10 km, acrescenta R$ 2,00 por km excedente.'
          if old not in s:
              raise SystemExit('Texto antigo não encontrado')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Salvar correção e remover este workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/corrigir-tarifa.yml
          git add index.html .github/workflows/corrigir-tarifa.yml
          git commit -m 'Corrigir tarifa exibida para R$ 2,00 por km'
          git push
