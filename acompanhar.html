<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>22 DRIVE — Acompanhar motorista</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,Roboto,Arial,sans-serif}.page{height:100dvh;display:flex;flex-direction:column}.top{min-height:78px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#050505;border-bottom:1px solid #ffc700;box-shadow:0 2px 18px #ffc70030}.logo{height:52px;width:min(230px,60vw);object-fit:contain;object-position:left center}.title{font-size:18px;font-weight:900;text-align:right}.info{padding:10px 12px;background:#07111f;border-bottom:1px solid #26364a}.info b{display:block;font-size:14px}.info small{display:block;margin-top:3px;color:#aebbd0;line-height:1.4}.status{margin-top:7px;padding:8px 10px;border-radius:11px;background:#0b1a2b;border:1px solid #2a3444;font-size:12px}.map-wrap{position:relative;flex:1;min-height:0}.map{width:100%;height:100%;background:#07111f}.leaflet-container{width:100%;height:100%}.live-driver-marker{background:transparent!important;border:0!important}.live-driver-marker span{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:#1683ff;border:3px solid #fff;box-shadow:0 0 0 9px #1683ff44,0 4px 12px #0008;font-size:25px}.updated{position:absolute;left:10px;right:10px;bottom:10px;z-index:1000;padding:9px 11px;border-radius:12px;background:#050505e8;border:1px solid #ffc700;color:#fff;font-size:11px;text-align:center}.back{position:absolute;top:10px;left:10px;z-index:1000;border:1px solid #ffc700;border-radius:12px;background:#050505e8;color:#fff;padding:10px 12px;font-weight:900}@media(max-width:600px){.top{min-height:70px}.logo{height:45px}.title{font-size:15px}.info{padding:9px 10px}}</style></head><body><div class="page"><header class="top"><img class="logo" src="./logo-driver-horizontal.svg" alt="22 DRIVE"><div class="title">Acompanhar motorista</div></header><section class="info"><b>🚗 22 DRIVE • <span id="trackingPassenger">Passageiro</span></b><small id="trackingRoute">Carregando viagem...</small><div class="status" id="trackingStatus">⏳ Aguardando o motorista iniciar a rota.</div></section><div class="map-wrap"><button class="back" type="button" onclick="history.back()">← Voltar</button><div id="trackingMap" class="map"></div><div id="trackingUpdated" class="updated">Aguardando localização...</div></div></div><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./live-location.js"></script></body></html>
